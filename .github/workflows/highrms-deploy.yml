name: HighRMS Backend CI/CD (OIDC)

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  IMAGE: highrms-backend
  REGISTRY_HOSTNAME: docker.io
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-079152808015fa1d3   # <-- Replace with your EC2 instance ID
  AWS_ROLE_ARN: arn:aws:iam::074122282902:role/aws-oidc-role-2  # <-- Replace

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      docker_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_HOSTNAME }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}
          tags: |
            type=sha

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy HighRMS to EC2 via SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=${{ env.INSTANCE_ID }}" \
            --parameters 'commands=[
              "cd /home/ubuntu/highrms",

              "export DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}",
              "export DOCKER_PASSWORD=${{ secrets.DOCKERHUB_PASSWORD }}",
              "export TAG=${{ needs.build-and-push.outputs.docker_tag }}",

              "echo $DOCKER_PASSWORD | docker login docker.io -u $DOCKER_USERNAME --password-stdin || exit 1",

              "sed -i \"s|image: .*highrms-backend:.*|image: docker.io/$DOCKER_USERNAME/highrms-backend:$TAG|\" docker-compose.yaml",

              "docker-compose pull || exit 1",
              "docker-compose down",
              "docker-compose up -d",

              "docker image prune -af || true"
            ]' \
            --comment "Deploying HighRMS Backend via GitHub OIDC" \
            --region ${{ env.AWS_REGION }}
