name: HighRMS Backend CI/CD (OIDC)

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  IMAGE: highrms-backend
  REGISTRY_HOSTNAME: docker.io
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-079152808015fa1d3
  AWS_ROLE_ARN: arn:aws:iam::074122282902:role/aws-oidc-role-2

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      docker_tag: ${{ steps.tag.outputs.TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔥 Create simple SHA tag manually (more reliable)
      - name: Set Docker Tag
        id: tag
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_HOSTNAME }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}:${{ steps.tag.outputs.TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy HighRMS to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=${{ env.INSTANCE_ID }}" \
            --parameters "commands=[
              \"cd /home/ubuntu/highrms\",
              \"export TAG=${{ needs.build-and-push.outputs.docker_tag }}\",
              \"docker login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}\",
              \"docker compose pull\",
              \"docker compose up -d\",
              \"docker image prune -af || true\"
            ]" \
            --query "Command.CommandId" \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id ${{ env.INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }}

          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ env.INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }}
