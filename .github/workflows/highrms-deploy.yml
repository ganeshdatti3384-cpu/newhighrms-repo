name: HighRMS Backend CI/CD (OIDC)

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  IMAGE: highrms-backend
  REGISTRY_HOSTNAME: docker.io
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-079152808015fa1d3
  AWS_ROLE_ARN: arn:aws:iam::074122282902:role/aws-oidc-role-2

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      docker_tag: ${{ steps.tag.outputs.TAG }}

    steps:
      - uses: actions/checkout@v4

      - name: Set Docker Tag
        id: tag
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_HOSTNAME }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}:${{ steps.tag.outputs.TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          TAG=${{ needs.build-and-push.outputs.docker_tag }}

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=${{ env.INSTANCE_ID }}" \
            --parameters commands="[
              \"cd /home/ubuntu/highrms\",
              \"echo TAG=$TAG > .env\",
              \"docker login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}\",
              \"docker compose --env-file .env pull\",
              \"docker compose --env-file .env up -d\",
              \"docker image prune -af || true\"
            ]" \
            --region ${{ env.AWS_REGION }}
